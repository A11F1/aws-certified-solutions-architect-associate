<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AWS SAA-C03 – Study Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<style>
  :root {
    /* Sidebar – dark */
    --sb-bg:      #0f1520;
    --sb-bg2:     #141c2e;
    --sb-border:  #1e2d4a;
    --sb-text:    #e8edf5;
    --sb-muted:   #6b7fa3;
    --sb-dim:     #3d5070;
    --orange:     #FF9900;
    --orange-dim: rgba(255,153,0,0.12);
    --blue:       #4A9EFF;
    --green:      #22a85a;
    --green-dim:  rgba(34,168,90,0.12);
    --purple:     #9B59B6;
    --red:        #E74C3C;

    /* Content – light */
    --ct-bg:      #f8f6f1;       /* creme muito suave */
    --ct-surface: #ffffff;
    --ct-border:  #e0d9ce;
    --ct-text:    #1a1a1a;       /* almost black — optimal contrast */
    --ct-muted:   #4a4a4a;
    --ct-dim:     #7a7a7a;
    --ct-accent:  #b35900;       /* dark orange — readable on a light background */
    --ct-blue:    #1a5fa8;
    --ct-green:   #1a7a3a;
    --ct-code-bg: #eeeae2;
    --ct-pre-bg:  #1e2433;

    --sidebar-w:  340px;
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--sb-bg);
    color: var(--sb-text);
    font-family: 'Inter', sans-serif;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ══ TOP BAR ══════════════════════════════════════════════════ */
  .topbar {
    background: #0a0e14;
    border-bottom: 1px solid var(--sb-border);
    padding: 0 20px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .topbar-left { display:flex; align-items:center; gap:12px; }
  .logo { font-family:'Syne',sans-serif; font-size:15px; font-weight:800; color:var(--sb-text); }
  .logo em { font-style:normal; color:var(--orange); }
  .pill {
    font-family:'Space Mono',monospace; font-size:10px;
    padding:3px 8px; background:var(--orange-dim);
    border:1px solid rgba(255,153,0,0.35); color:var(--orange);
    border-radius:3px; letter-spacing:1.5px;
  }
  .topbar-right { display:flex; align-items:center; gap:12px; }
  .gh-link {
    font-family:'Space Mono',monospace; font-size:11px;
    color:var(--orange); text-decoration:none;
    border:1px solid rgba(255,153,0,0.3); padding:5px 12px;
    border-radius:4px; transition:all .15s;
  }
  .gh-link:hover { background:var(--orange-dim); }

  /* ══ PROGRESS BAR ═════════════════════════════════════════════ */
  .progress-bar-wrap {
    flex-shrink:0; background:#0a0e14;
    border-bottom:1px solid var(--sb-border);
    padding:9px 20px;
    display:flex; align-items:center; gap:14px;
  }
  .prog-label { font-family:'Space Mono',monospace; font-size:10px; color:var(--sb-muted); white-space:nowrap; }
  .prog-label strong { color:var(--orange); }
  .prog-track { flex:1; height:5px; background:var(--sb-border); border-radius:3px; overflow:hidden; }
  .prog-fill { height:100%; background:linear-gradient(90deg,#22a85a,var(--orange)); border-radius:3px; transition:width .4s ease; }
  .prog-pct { font-family:'Space Mono',monospace; font-size:11px; color:#22a85a; font-weight:700; min-width:34px; text-align:right; }
  .domain-stats { display:flex; gap:10px; flex-shrink:0; }
  .ds { display:flex; align-items:center; gap:4px; font-family:'Space Mono',monospace; font-size:10px; color:var(--sb-muted); }
  .ds-dot { width:6px; height:6px; border-radius:50%; }

  /* ══ LAYOUT ═══════════════════════════════════════════════════ */
  .layout { display:flex; flex:1; overflow:hidden; }

  /* ══ SIDEBAR ══════════════════════════════════════════════════ */
  .sidebar {
    width:var(--sidebar-w); min-width:var(--sidebar-w);
    background:var(--sb-bg); border-right:1px solid var(--sb-border);
    display:flex; flex-direction:column; overflow:hidden;
  }
  .sidebar-top {
    padding:12px 14px; border-bottom:1px solid var(--sb-border);
    flex-shrink:0; display:flex; flex-direction:column; gap:8px;
  }
  .search-input {
    width:100%; background:var(--sb-bg2); border:1px solid var(--sb-border);
    border-radius:5px; padding:8px 12px;
    font-family:'Space Mono',monospace; font-size:11px;
    color:var(--sb-text); outline:none; transition:border-color .2s;
  }
  .search-input::placeholder { color:var(--sb-dim); }
  .search-input:focus { border-color:rgba(255,153,0,0.45); }
  .filter-row { display:flex; gap:6px; }
  .filter-btn {
    font-family:'Space Mono',monospace; font-size:9px;
    padding:4px 8px; border:1px solid var(--sb-border);
    background:transparent; color:var(--sb-dim);
    border-radius:3px; cursor:pointer; transition:all .15s;
  }
  .filter-btn:hover { border-color:var(--orange); color:var(--orange); }
  .filter-btn.active { background:var(--orange-dim); border-color:rgba(255,153,0,0.5); color:var(--orange); }
  .sidebar-list { overflow-y:auto; flex:1; padding:8px 0; }
  .sidebar-list::-webkit-scrollbar { width:4px; }
  .sidebar-list::-webkit-scrollbar-thumb { background:var(--sb-border); border-radius:2px; }

  .week-header-row {
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 14px 4px;
  }
  .week-label {
    font-family:'Space Mono',monospace; font-size:9px;
    letter-spacing:2px; color:var(--sb-dim); text-transform:uppercase;
  }
  .week-prog { font-family:'Space Mono',monospace; font-size:9px; color:var(--sb-dim); }
  .week-prog.done { color:#22a85a; }

  .mod-item {
    display:flex; align-items:center; gap:8px;
    padding:8px 14px; cursor:pointer;
    transition:background .15s; border-left:3px solid transparent;
    user-select:none;
  }
  .mod-item:hover { background:var(--sb-bg2); }
  .mod-item.active { background:var(--sb-bg2); border-left-color:var(--orange); }
  .mod-item.active .mod-num { color:var(--orange); }
  .mod-item.completed .mod-name { color:var(--sb-dim); text-decoration:line-through; text-decoration-color:var(--sb-dim); }

  .mod-check {
    width:16px; height:16px; flex-shrink:0;
    border:1.5px solid var(--sb-border); border-radius:3px;
    display:flex; align-items:center; justify-content:center;
    transition:all .15s; cursor:pointer;
  }
  .mod-check:hover { border-color:#22a85a; }
  .mod-check.checked { background:#22a85a; border-color:#22a85a; }
  .mod-check.checked::after { content:'✓'; color:#fff; font-size:10px; font-weight:700; line-height:1; }

  .mod-dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; }
  .mod-num { font-family:'Space Mono',monospace; font-size:10px; color:var(--sb-dim); width:24px; flex-shrink:0; }
  .mod-name { font-size:12px; font-weight:500; color:var(--sb-muted); line-height:1.3; flex:1; transition:color .15s; }
  .mod-item:hover .mod-name, .mod-item.active .mod-name { color:var(--sb-text); }
  .mod-badges { display:flex; gap:3px; flex-shrink:0; }
  .mbadge { font-size:8px; padding:1px 4px; border-radius:2px; font-family:'Space Mono',monospace; font-weight:700; }
  .mb-lab { background:rgba(231,76,60,0.2); color:var(--red); }
  .mb-cs  { background:rgba(34,168,90,0.15); color:#22a85a; }
  .mb-q   { background:var(--orange-dim); color:var(--orange); }

  /* ══ CONTENT PANEL ════════════════════════════════════════════ */
  .content-panel {
    flex:1; display:flex; flex-direction:column;
    overflow:hidden; background:var(--ct-bg);
  }
  .content-header {
    padding:0 28px; border-bottom:1px solid var(--ct-border);
    display:flex; align-items:center; justify-content:space-between;
    flex-shrink:0; height:52px;
    background:var(--ct-surface);
    box-shadow:0 1px 4px rgba(0,0,0,0.06);
  }
  .breadcrumb {
    font-family:'Space Mono',monospace; font-size:11px;
    color:var(--ct-dim); display:flex; align-items:center; gap:8px;
  }
  .breadcrumb-sep { color:#ccc; }
  .breadcrumb-current { color:var(--ct-muted); font-weight:700; }
  .content-actions { display:flex; gap:8px; align-items:center; }
  .action-btn {
    font-family:'Space Mono',monospace; font-size:10px;
    padding:5px 10px; border:1px solid var(--ct-border);
    background:transparent; color:var(--ct-dim);
    border-radius:4px; cursor:pointer; transition:all .15s;
    text-decoration:none; display:inline-flex; align-items:center; gap:5px;
  }
  .action-btn:hover { border-color:var(--ct-accent); color:var(--ct-accent); background:rgba(179,89,0,0.06); }
  .action-btn.done-btn { border-color:var(--ct-green); color:var(--ct-green); background:rgba(26,122,58,0.08); }
  .action-btn.done-btn:hover { background:rgba(26,122,58,0.14); }

  .content-body { flex:1; overflow-y:auto; padding:48px 64px; background:var(--ct-bg); }
  .content-body::-webkit-scrollbar { width:8px; }
  .content-body::-webkit-scrollbar-track { background:var(--ct-bg); }
  .content-body::-webkit-scrollbar-thumb { background:var(--ct-border); border-radius:4px; }

  /* ══ WELCOME ══════════════════════════════════════════════════ */
  .welcome {
    display:flex; flex-direction:column; align-items:center;
    justify-content:center; height:100%; text-align:center;
    gap:20px; padding:40px;
  }
  .welcome-icon { font-size:48px; opacity:.3; }
  .welcome h2 { font-family:'Syne',sans-serif; font-size:22px; font-weight:800; color:var(--ct-muted); }
  .welcome p { font-size:14px; line-height:1.9; color:var(--ct-dim); max-width:380px; }
  .domain-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; max-width:440px; width:100%; }
  .domain-mini { background:var(--ct-surface); border:1px solid var(--ct-border); border-radius:8px; padding:16px; text-align:left; box-shadow:0 1px 4px rgba(0,0,0,0.04); }
  .dm-top { display:flex; justify-content:space-between; align-items:flex-start; }
  .dm-pct { font-family:'Space Mono',monospace; font-size:22px; font-weight:700; }
  .dm-prog { font-family:'Space Mono',monospace; font-size:10px; color:var(--ct-dim); }
  .dm-name { font-size:12px; color:var(--ct-muted); margin-top:6px; font-weight:500; }
  .dm-bar { height:3px; background:var(--ct-border); border-radius:2px; margin-top:10px; overflow:hidden; }
  .dm-fill { height:100%; border-radius:2px; transition:width .5s; }
  .dm1 .dm-pct { color:var(--ct-blue); } .dm1 .dm-fill { background:var(--ct-blue); }
  .dm2 .dm-pct { color:var(--ct-green); } .dm2 .dm-fill { background:var(--ct-green); }
  .dm3 .dm-pct { color:var(--purple); }   .dm3 .dm-fill { background:var(--purple); }
  .dm4 .dm-pct { color:var(--ct-accent); } .dm4 .dm-fill { background:var(--ct-accent); }

  /* ══ LOADING ══════════════════════════════════════════════════ */
  .loading { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; gap:16px; }
  .spinner { width:30px; height:30px; border:2px solid var(--ct-border); border-top-color:var(--ct-accent); border-radius:50%; animation:spin .7s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .loading-text { font-family:'Space Mono',monospace; font-size:11px; color:var(--ct-dim); }

  /* ══ ERROR ════════════════════════════════════════════════════ */
  .error-state { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; gap:12px; font-family:'Space Mono',monospace; font-size:12px; color:var(--ct-dim); text-align:center; }
  .error-state .err-code { font-size:32px; color:var(--red); font-weight:700; }

  /* ══ COMPLETE BANNER ══════════════════════════════════════════ */
  .complete-banner {
    background:#f0faf4; border:1px solid #a8dbb9; border-radius:8px;
    padding:12px 18px; margin-bottom:28px;
    display:flex; align-items:center; gap:12px;
    font-size:14px; font-weight:500; color:var(--ct-green);
  }

  /* ══ MARKDOWN – READING OPTIMIZED ════════════════════════════ */
  .md-content {
    max-width: 740px;          /* linha de leitura ideal ~70 chars */
    font-family: 'Inter', sans-serif;
    font-size: 16px;           /* comfortable base */
    line-height: 1.85;         /* entrelinha generosa */
    color: var(--ct-text);
    background: transparent;
  }

  /* Heading hierarchy with clear visual weight */
  .md-content h1 {
    font-family: 'Syne', sans-serif;
    font-size: 28px; font-weight: 800;
    color: #111;
    margin: 0 0 20px;
    line-height: 1.2;
    padding-bottom: 14px;
    border-bottom: 3px solid var(--ct-accent);
  }
  .md-content h2 {
    font-family: 'Syne', sans-serif;
    font-size: 21px; font-weight: 700;
    color: #1a1a1a;
    margin: 44px 0 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--ct-border);
  }
  .md-content h3 {
    font-size: 17px; font-weight: 700;
    color: var(--ct-accent);
    margin: 32px 0 10px;
  }
  .md-content h4 {
    font-size: 15px; font-weight: 600;
    color: var(--ct-blue);
    margin: 22px 0 8px;
  }

  /* Paragraphs with generous spacing */
  .md-content p {
    margin-bottom: 18px;
    color: #1a1a1a;
  }

  /* Lists with indentation and spacing */
  .md-content ul, .md-content ol {
    padding-left: 28px;
    margin-bottom: 18px;
  }
  .md-content li {
    margin-bottom: 7px;
    color: #1a1a1a;
  }
  .md-content li::marker { color: var(--ct-accent); }

  /* Inline code — soft background, easy on the eyes */
  .md-content code {
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    background: var(--ct-code-bg);
    border: 1px solid #d5cfc6;
    padding: 2px 6px;
    border-radius: 4px;
    color: #8b3000;              /* readable reddish brown */
    word-break: break-word;
  }

  /* Code block — dark background (great contrast for code) */
  .md-content pre {
    background: var(--ct-pre-bg);
    border-radius: 8px;
    padding: 22px 24px;
    overflow-x: auto;
    margin: 20px 0 24px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
  }
  .md-content pre code {
    background: none; border: none; padding: 0;
    color: #a8d8a0;              /* soft green — good readability on dark */
    font-size: 13.5px; line-height: 1.7;
    word-break: normal;
  }

  /* Blockquote — subtle highlight */ 
  .md-content blockquote {
    border-left: 4px solid var(--ct-accent);
    padding: 10px 20px;
    margin: 20px 0;
    background: #fdf5ec;
    border-radius: 0 6px 6px 0;
    color: var(--ct-muted);
    font-style: italic;
  }

  /* Tables — alternating background for easier reading */
  .md-content table {
    border-collapse: collapse;
    width: 100%;
    margin: 20px 0 28px;
    font-size: 14px;
    background: var(--ct-surface);
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .md-content th {
    background: #f0ebe3;
    color: #2a2a2a;
    font-size: 12px;
    font-weight: 700;
    padding: 12px 16px;
    border-bottom: 2px solid var(--ct-border);
    text-align: left;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .md-content td {
    padding: 11px 16px;
    border-bottom: 1px solid var(--ct-border);
    color: var(--ct-muted);
    vertical-align: top;
    line-height: 1.6;
  }
  .md-content tr:last-child td { border-bottom: none; }
  .md-content tr:nth-child(even) td { background: #faf7f2; }
  .md-content tr:hover td { background: #f3ede4; }

  /* Links — color that contrasts with a light background */
  .md-content a {
    color: var(--ct-blue);
    text-decoration: none;
    border-bottom: 1px solid rgba(26,95,168,0.35);
    transition: border-color .15s, color .15s;
  }
  .md-content a:hover { color: #0d3e72; border-color: #0d3e72; }

  /* Bold and italic */
  .md-content strong { color: #111; font-weight: 700; }
  .md-content em { color: var(--ct-muted); font-style: italic; }

  /* Divider line */
  .md-content hr { border:none; border-top:2px solid var(--ct-border); margin:40px 0; }

  /* Imagens */
  .md-content img { max-width:100%; border-radius:8px; margin:16px 0; box-shadow:0 2px 8px rgba(0,0,0,0.1); }


  /* Tabs */
  .tab-row { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:28px; padding-bottom:14px; border-bottom:1px solid var(--ct-border); }
  .tab-btn { font-family:'Space Mono',monospace; font-size:11px; padding:6px 12px; border:1px solid var(--ct-border); background:var(--ct-surface); color:var(--ct-muted); border-radius:4px; cursor:pointer; transition:all .15s; }
  .tab-btn:hover { border-color:var(--ct-accent); color:var(--ct-accent); }
  .tab-btn.active { background:var(--ct-accent); border-color:var(--ct-accent); color:#fff; }

  /* Answer reveal blocks in questions/flashcards */
  .md-content details { background:var(--ct-surface); border:1px solid var(--ct-border); border-radius:8px; padding:12px 18px; margin:14px 0 22px; }
  .md-content details[open] { border-color:var(--ct-accent); }
  .md-content summary { cursor:pointer; font-weight:600; color:var(--ct-accent); }
  .md-content details > :not(summary) { margin-top:12px; }


  /* Exam-style quiz */
  .quiz { max-width:740px; }
  .quiz-top { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:10px; font-family:'Space Mono',monospace; font-size:11px; color:var(--ct-dim); }
  .quiz-mode button { font-family:'Space Mono',monospace; font-size:10px; padding:4px 9px; border:1px solid var(--ct-border); background:transparent; color:var(--ct-dim); border-radius:3px; cursor:pointer; }
  .quiz-mode button.active { background:var(--ct-text); color:#fff; border-color:var(--ct-text); }
  .quiz-bar { height:4px; background:var(--ct-border); border-radius:2px; overflow:hidden; margin-bottom:18px; }
  .quiz-bar > div { height:100%; background:var(--ct-accent); transition:width .3s; }
  .quiz-nav { display:flex; flex-wrap:wrap; gap:5px; margin-bottom:24px; }
  .qdot { width:26px; height:26px; font-family:'Space Mono',monospace; font-size:10px; border:1px solid var(--ct-border); background:var(--ct-surface); color:var(--ct-muted); border-radius:4px; cursor:pointer; }
  .qdot.current { border-color:var(--ct-accent); color:var(--ct-accent); font-weight:700; }
  .qdot.right { background:#e3f4e9; border-color:#7cc596; color:var(--ct-green); }
  .qdot.wrong { background:#fbe6e3; border-color:#e49a92; color:#b3261e; }
  .quiz-meta { font-family:'Space Mono',monospace; font-size:11px; color:var(--ct-dim); margin-bottom:10px; }
  .quiz-q { font-size:17px; line-height:1.7; font-weight:500; margin-bottom:20px; color:var(--ct-text); }
  .quiz-hint { font-size:12px; color:var(--ct-accent); margin:-8px 0 14px; font-family:'Space Mono',monospace; }
  .opt { display:flex; gap:12px; align-items:flex-start; width:100%; text-align:left; background:var(--ct-surface); border:1.5px solid var(--ct-border); border-radius:8px; padding:13px 16px; margin-bottom:10px; cursor:pointer; font:inherit; font-size:15px; line-height:1.55; color:var(--ct-text); transition:border-color .15s, background .15s; }
  .opt:hover:not(:disabled) { border-color:var(--ct-accent); }
  .opt .mark { flex-shrink:0; width:22px; height:22px; border:1.5px solid #b9b2a6; border-radius:50%; margin-top:1px; display:flex; align-items:center; justify-content:center; font-size:11px; font-family:'Space Mono',monospace; font-weight:700; color:var(--ct-muted); }
  .opt.multi .mark { border-radius:4px; }
  .opt.selected { border-color:var(--ct-accent); background:#fdf5ec; }
  .opt.selected .mark { background:var(--ct-accent); border-color:var(--ct-accent); color:#fff; }
  .opt.correct { border-color:#3f9d5f; background:#e9f6ee; }
  .opt.correct .mark { background:#3f9d5f; border-color:#3f9d5f; color:#fff; }
  .opt.incorrect { border-color:#d2554b; background:#fcebe9; }
  .opt.incorrect .mark { background:#d2554b; border-color:#d2554b; color:#fff; }
  .opt:disabled { cursor:default; }
  .opt p { margin:0; }
  .quiz-actions { display:flex; gap:10px; margin-top:20px; }
  .qbtn { font-family:'Space Mono',monospace; font-size:12px; padding:9px 18px; border-radius:5px; cursor:pointer; border:1px solid var(--ct-accent); background:var(--ct-accent); color:#fff; }
  .qbtn.secondary { background:transparent; color:var(--ct-accent); }
  .qbtn:disabled { opacity:.4; cursor:not-allowed; }
  .quiz-feedback { margin-top:22px; padding:16px 20px; border-radius:8px; font-size:14.5px; line-height:1.7; }

const TABS = [
  { key:'README.md',       label:'Theory' },
  { key:'questoes.md',     label:'Questions' },
  { key:'flashcards.md',   label:'Flashcards' },
  { key:'cheatsheet.md',   label:'Cheatsheet' },
  { key:'lab.md',          label:'Lab' },
  { key:'casos-de-uso.md', label:'Use Cases' },
  { key:'links.md',        label:'Links' },
];
const fileCache = {};
let activeTab = null;

function updateContentHeader() {
  if (!activeModule) return;

  const path = activeTab ? `${modDir(m)}/${activeTab}` : m.file;

function modDir(m) { return m.file.split('/')[0]; }

// Prefer the local copy (works on GitHub Pages or a local server); fall back to GitHub raw.
async function fetchText(path) {
  if (path in fileCache) return fileCache[path];
  let res = null;
  try { res = await fetch(encodeURI(path)); } catch { res = null; }
  if (!res || !res.ok) { try { res = await fetch(`${BASE}/${path}`); } catch { res = null; } }
  const txt = (res && res.ok) ? await res.text() : null;
  fileCache[path] = txt;
  return txt;
}

function renderTabs(avail) {

// ---------- Exam-style quiz ----------
let quizMode = true;           // Questions tab: true = exam mode, false = reading mode
let quiz = null;               // { qs, idx, answers, num }

function parseQuiz(txt) {
  const blocks = txt.replace(/^\uFEFF/, '').split(/^## /m).slice(1);
  const qs = [];
  for (const blk of blocks) {
    const nl = blk.indexOf('\n');
    const title = blk.slice(0, nl).trim();
    let body = blk.slice(nl + 1);
    let details = '';
    const dm = body.match(/<details>([\s\S]*?)<\/details>/);
    if (dm) { details = dm[1]; body = body.replace(dm[0], ''); }
    const stem = [], opts = [];
    for (const line of body.split('\n')) {
      const om = line.match(/^\s*(?:[-*]\s*)?\*{0,2}([A-E])[\).]\*{0,2}\s+(.+)$/);
      if (om) opts.push({ letter: om[1], text: om[2].trim() });
      else if (!opts.length && line.trim() && line.trim() !== '---') stem.push(line.trim());
    }
    const am = details.match(/(?:Correct answer|Answer)\W{0,6}([A-E](?:\s*(?:,|and|&)\s*[A-E])*)\b/i);
    if (opts.length < 2 || !am) continue;
    const correct = am[1].toUpperCase().match(/[A-E]/g);
    let expl = details.replace(/<summary>[\s\S]*?<\/summary>/, '')
      .replace(/^\s*\*{0,2}\s*(?:Correct answer|Answer)\W{0,6}[A-E][^\n]*\n?/im, '').trim();
    qs.push({ title, stem: stem.join('\n\n'), opts, correct, expl });
  }
  return qs;
}

function quizHeader() {
  return `<div class="quiz-top"><span id="quizCount"></span><span class="quiz-mode">
    <button class="${quizMode?'active':''}" onclick="setQuizMode(true)">Exam mode</button>
    <button class="${quizMode?'':'active'}" onclick="setQuizMode(false)">Reading mode</button></span></div>`;
}
function setQuizMode(on) { quizMode = on; showTab('questoes.md'); }

const shuffleOpts = true;     // options are always shuffled each attempt

// Return a copy of q with options in random order, letters reassigned,
// and "Option X" references in the explanation remapped to the new letters.
function shuffleQ(q) {
  const keep = q.opts.some(o => /\b(all|none|both)\b.*\b(above|these)\b|^(all|none) of/i.test(o.text));
  if (!shuffleOpts || keep) return q;
  const arr = q.opts.slice();
  for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
  const map = {}, letters = 'ABCDE';
  const opts = arr.map((o, i) => { map[o.letter] = letters[i]; return { letter: letters[i], text: o.text }; });
  const re = (s) => s.replace(/\b(Options?|options?|alternatives?|Alternatives?|Answers?|answers?|Choices?|choices?)(\s+)([A-E](?:(?:,\s*|\s+and\s+|\s+or\s+|\/)[A-E])*)\b/g,
    (m, w, sp, ls) => w + sp + ls.replace(/[A-E]/g, c => map[c] || c));
  return { ...q, opts, correct: q.correct.map(c => map[c]).sort(), expl: re(q.expl) };
}

function startQuiz(qs0) {
  const qs = qs0.map(shuffleQ);
  quiz = { src: qs0, qs, idx: 0, num: activeModule.num, answers: qs.map(() => ({ picked: [], checked: false })) };
  renderQuiz();
}

function renderQuiz() {
  const q = quiz.qs[quiz.idx], a = quiz.answers[quiz.idx];
  const total = quiz.qs.length, done = quiz.answers.filter(x => x.checked).length;
  const multi = q.correct.length > 1;
  const nav = quiz.qs.map((qq, i) => {
    const ans = quiz.answers[i];
    const cls = i === quiz.idx ? 'current' : (ans.checked ? (isRight(i) ? 'right' : 'wrong') : '');
    return `<button class="qdot ${cls}" onclick="gotoQ(${i})">${i+1}</button>`;
  }).join('');
  const opts = q.opts.map(o => {
    let cls = 'opt' + (multi ? ' multi' : '');
    if (a.checked) {
      if (q.correct.includes(o.letter)) cls += ' correct';
      else if (a.picked.includes(o.letter)) cls += ' incorrect';
    } else if (a.picked.includes(o.letter)) cls += ' selected';
    return `<button class="${cls}" ${a.checked ? 'disabled' : ''} onclick="pick('${o.letter}')"><span class="mark">${o.letter}</span><span>${marked.parseInline(o.text)}</span></button>`;
  }).join('');
  let feedback = '';
  if (a.checked) {
    const ok = isRight(quiz.idx);
    feedback = `<div class="quiz-feedback ${ok?'ok':'no'}"><div class="verdict">${ok ? '✓ Correct' : '✗ Incorrect — correct answer: ' + q.correct.join(', ')}</div>${q.expl ? marked.parse(q.expl) : ''}</div>`;
  }
  const last = quiz.idx === total - 1;
  const body = document.getElementById('quizBody');
  body.innerHTML = `
    <div class="quiz-bar"><div style="width:${done/total*100}%"></div></div>
    <div class="quiz-nav">${nav}</div>
    <div class="quiz-meta">${q.title}</div>
    <div class="quiz-q">${marked.parse(q.stem)}</div>
    ${multi ? `<div class="quiz-hint">Select ${q.correct.length} answers</div>` : ''}
    ${opts}
    <div class="quiz-actions">
      ${a.checked ? '' : `<button class="qbtn" ${a.picked.length ? '' : 'disabled'} onclick="checkQ()">Check answer</button>`}
      ${idxPrev()} 
      ${a.checked || last ? `<button class="qbtn ${a.checked ? '' : 'secondary'}" onclick="${last ? 'finishQuiz()' : 'gotoQ(' + (quiz.idx + 1) + ')'}">${last ? 'Finish' : 'Next →'}</button>` : ''}
    </div>${feedback}`;
  document.getElementById('quizCount').textContent = `Question ${quiz.idx + 1} of ${total} · ${done} answered`;
}
function idxPrev() { return quiz.idx > 0 ? `<button class="qbtn secondary" onclick="gotoQ(${quiz.idx - 1})">← Back</button>` : ''; }
function isRight(i) {
  const q = quiz.qs[i], p = quiz.answers[i].picked;
  return p.length === q.correct.length && q.correct.every(c => p.includes(c));
}
function gotoQ(i) { quiz.idx = i; renderQuiz(); }
function pick(letter) {
  const q = quiz.qs[quiz.idx], a = quiz.answers[quiz.idx];
  if (a.checked) return;
  if (q.correct.length > 1) {
    a.picked = a.picked.includes(letter) ? a.picked.filter(x => x !== letter) : [...a.picked, letter];
  } else a.picked = [letter];
  renderQuiz();
}
function checkQ() { quiz.answers[quiz.idx].checked = true; renderQuiz(); }
function finishQuiz() {
  const total = quiz.qs.length;
  const score = quiz.qs.reduce((n, _, i) => n + (quiz.answers[i].checked && isRight(i) ? 1 : 0), 0);
  const pct = Math.round(score / total * 100);
  let best = pct;
  try { best = Math.max(pct, +(localStorage.getItem('aws-saa-quiz-' + quiz.num) || 0)); localStorage.setItem('aws-saa-quiz-' + quiz.num, best); } catch {}
  const unanswered = quiz.answers.filter(x => !x.checked).length;
  document.getElementById('quizBody').innerHTML = `<div class="quiz-result">
    <div class="score">${pct}%</div>
    <div class="sub">${score} of ${total} correct${unanswered ? ` · ${unanswered} unanswered` : ''} · best ${best}% · pass mark 72%</div>
    <div class="actions"><button class="qbtn" onclick="startQuiz(quiz.src)">Retake</button>
    <button class="qbtn secondary" onclick="gotoQ(0)">Review answers</button></div></div>`;
  document.getElementById('quizCount').textContent = 'Results';
}

let availTabs = [];
async function showTab(key) {
  activeTab = key;
  updateContentHeader();
  const body = document.getElementById('contentBody');
  const txt = await fetchText(`${modDir(activeModule)}/${key}`);
  const banner = isCompleted(activeModule.num) ? `<div class="complete-banner">✅ &nbsp;Module marked as completed. Nice work!</div>` : '';
  if (txt === null) {
    body.innerHTML = renderTabs(availTabs) + `<div class="error-state"><div class="err-code">:(</div><div>Could not load the content.</div></div>`;
    return;
  }
  if (key === 'questoes.md' && quizMode) {
    const qs = parseQuiz(txt);
    if (qs.length) {
      body.innerHTML = renderTabs(availTabs) + `<div class="quiz">${quizHeader()}<div id="quizBody"></div></div>`;
      startQuiz(qs); body.scrollTop = 0; return;
    }
  }
  const modeBar = key === 'questoes.md' ? `<div class="quiz">${quizHeader()}</div>` : '';
  // Strip a leading BOM and render markdown (raw <details> blocks pass through).
  body.innerHTML = renderTabs(availTabs) + modeBar + banner + `<div class="md-content">${marked.parse(txt.replace(/^\uFEFF/, ''))}</div>`;
  body.scrollTop = 0;
}

async function loadModule(mod) {
  activeNum = mod.num; activeModule = mod;
  buildSidebar(getCurrentFiltered());
  document.getElementById('breadcrumbCurrent').textContent = `${mod.num} · ${mod.name}`;
  const own = mod.file.split('/')[1];
  activeTab = own;
  updateContentHeader();
  document.getElementById('contentBody').innerHTML = `<div class="loading"><div class="spinner"></div><div class="loading-text">Loading module ${mod.num}…</div></div>`;
  const dir = modDir(mod);
  const found = await Promise.all(TABS.map(async tb => (await fetchText(`${dir}/${tb.key}`)) !== null ? tb : null));
  if (activeNum !== mod.num) return; // user switched modules meanwhile
  availTabs = found.filter(Boolean);
  if (!availTabs.some(tb => tb.key === own)) availTabs.unshift({ key: own, label: own === 'lab.md' ? 'Lab' : 'Theory' });
  await showTab(own);
}

let toastTimer;
function showToast(msg, pos) {
  const el=document.getElementById('toast'), dot=document.getElementById('toastDot'), txt=document.getElementById('toastMsg');
  txt.textContent=msg; dot.className='toast-dot'+(pos?'':' undo');
  el.classList.add('show'); clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 2500);
}

loadProgress(); updateProgressBar(); buildSidebar(MODULES); updateWelcomeDomains();
</script>
